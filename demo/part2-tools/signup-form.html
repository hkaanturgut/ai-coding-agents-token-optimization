<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign up</title>

      <label>Full name <input type="text" name="name" required /></label>

      <label>Password <input type="password" name="password" required /></label>
      <!-- Add a date-of-birth field here -->
      <button type="submit">Create account</button>
    </form>
